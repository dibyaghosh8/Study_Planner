<!DOCTYPE html>
<html>
<head>
    <title>StudyFlow Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
/* 
LOGIN PAGE
*/

.login-body{
    min-height:100vh;
    background:linear-gradient(135deg,#4f46e5,#818cf8);
    display:flex;
    justify-content:center;
    align-items:center;
}

/* LOGIN BOX */

.login-box{
    width:380px;
    background:white;
    padding:40px 35px;
    border-radius:30px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.15);
    animation:loginAnimation .5s ease;
}

@keyframes loginAnimation{
    from{
        opacity:0;
        transform:translateY(-30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* LOGO */

.logo-icon{
    font-size:65px;
    color:#4f46e5;
    margin-bottom:15px;
}

.login-box h1{
    font-size:36px;
    color:#3730a3;
    margin-bottom:8px;
}

.login-box p{
    color:#777;
    margin-bottom:30px;
}

/* INPUT */

.login-box input{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:15px;
    outline:none;
    font-size:16px;
    margin-bottom:20px;
}

.login-box input:focus{
    border-color:#4f46e5;
    box-shadow:0 0 8px rgba(79,70,229,.3);
}

/* BUTTON */

.login-box button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#4f46e5;
    color:white;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

.login-box button:hover{
    background:#3730a3;
    transform:translateY(-3px);
}

.login-box button i{
    margin-right:8px;
}

/* MOBILE */

@media(max-width:500px){

    .login-box{
        width:90%;
        padding:35px 25px;
    }

    .login-box h1{
        font-size:30px;
    }

}
</style>
</head>
<body class="login-body">
    <div class="login-box">
        <i class="fa-solid fa-book-open logo-icon"></i>
        <h1>StudyFlow</h1>
        <p>Smart Study Planner</p>
        <input type="text" id="nameInput" placeholder="Enter Your Name">
        <button onclick="login()">
            <i class="fa-solid fa-right-to-bracket"></i>
            Login
        </button>
    </div>

    <script src="script.js"></script>

</body>
</html>
