<!DOCTYPE html>
<html0.>
<head>
    <title>StudyFlow Analytics</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    background:#f5f7fb;
    padding:40px 60px;
}

/* HEADER */

.header{
    background:white;
    padding:30px;
    border-radius:25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 15px 35px rgba(0,0,0,.08);
    margin-bottom:30px;
}

.header h1{
    color:#4f46e5;
    font-size:32px;
}

.header p{
    color:#777;
    margin-top:5px;
}

.back{
    text-decoration:none;
    background:#4f46e5;
    color:white;
    padding:14px 22px;
    border-radius:14px;
}

/* TOP CARDS */

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:25px;
}

.card{
    background:white;
    padding:30px;
    border-radius:25px;
    box-shadow:0 15px 35px rgba(0,0,0,.07);
}

.card h3{
    color:#555;
    font-size:17px;
    margin-bottom:15px;
}

.number{
    font-size:38px;
    font-weight:bold;
    color:#4f46e5;
}

/* SECTIONS */

.section{
    background:white;
    padding:35px;
    margin-top:30px;
    border-radius:25px;
    box-shadow:0 15px 35px rgba(0,0,0,.07);
}

.section h2{
    margin-bottom:25px;
}

/* SUBJECT BAR */

.bar-box{
    margin-bottom:20px;
}

.bar-title{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
}

.bar{
    height:22px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
}

.fill{
    height:100%;
    background:#4f46e5;
    border-radius:20px;
}

/* TASK */

.task{
    background:#f8fafc;
    padding:18px;
    border-radius:18px;
    margin-bottom:15px;
}

.task h3{
    color:#333;
    margin-bottom:8px;
}

.complete{
    color:#16a34a;
    font-weight:bold;
}

.pending{
    color:#dc2626;
    font-weight:bold;
}

/* EMPTY */

.empty{
    text-align:center;
    color:#777;
    padding:20px;
}

/* RESPONSIVE */

@media(max-width:1000px){
    .cards{
        grid-template-columns:repeat(2,1fr);
    }

    body{
        padding:30px;
    }
}

@media(max-width:600px){
    body{
        padding:15px;
    }

    .header{
        flex-direction:column;
        gap:20px;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .section{
        padding:20px;
    }

    .header h1{
        font-size:25px;
    }
}
</style>


</head>



<body>

    <!-- Header -->
    <div class="header">
        <div>
            <h1>📊 StudyFlow Analytics</h1>
            <p id="username">Student Performance</p>
        </div>

        <a href="dashboard.html" class="back">
            ⬅ Dashboard
        </a>
    </div>

    <!-- Top Cards -->
    <div class="cards">

        <div class="card">
            <h3>⏱ Total Study Time</h3>
            <div class="number" id="studyTime">0h</div>
        </div>

        <div class="card">
            <h3>✅ Completed</h3>
            <div class="number" id="completed">0%</div>
        </div>

        <div class="card">
            <h3>⏳ Pending</h3>
            <div class="number" id="pending">0</div>
        </div>

        <div class="card">
            <h3>⭐ Score</h3>
            <div class="number" id="score">0</div>
        </div>

    </div>

    <!-- Subject Performance -->
    <div class="section">
        <h2>📚 Subject Wise Study</h2>
        <div id="subjects"></div>
    </div>

    <!-- Task Performance -->
    <div class="section">
        <h2>📝 Task Performance</h2>
        <div id="taskData"></div>
    </div>

    <script>

        let user = localStorage.getItem("studyUser") || "User";

        document.getElementById("username").innerHTML = "Welcome " + user;

        let tasks = JSON.parse(localStorage.getItem(user + "_tasks")) || [];

        let totalMinutes = 0;
        let completed = 0;
        let subjectData = {};

        tasks.forEach(task => {

            let time = Number(task.focusTime || 0);

            totalMinutes += time;

            if (task.complete) {
                completed++;
            }

            if (!subjectData[task.subject]) {
                subjectData[task.subject] = 0;
            }

            subjectData[task.subject] += time;

        });

        // Total Study Time
        let hour = Math.floor(totalMinutes / 60);
        let min = totalMinutes % 60;

        document.getElementById("studyTime").innerHTML = hour + "h " + min + "m";

        // Completion Percentage
        let percent = 0;

        if (tasks.length > 0) {
            percent = Math.round((completed / tasks.length) * 100);
        }

        document.getElementById("completed").innerHTML = percent + "%";
        document.getElementById("pending").innerHTML = tasks.length - completed;
        document.getElementById("score").innerHTML = percent;

        // Subject Progress
        let subjectBox = document.getElementById("subjects");

        let max = 0;

        Object.values(subjectData).forEach(value => {
            if (value > max) {
                max = value;
            }
        });

        if (Object.keys(subjectData).length === 0) {

            subjectBox.innerHTML = `
                <div class="empty">
                    No Study Data Available
                </div>
            `;

        } else {

            for (let sub in subjectData) {

                let width = Math.round((subjectData[sub] / max) * 100);

                subjectBox.innerHTML += `
                    <div class="bar-box">

                        <div class="bar-title">
                            <b>${sub}</b>
                            <span>
                                ${Math.floor(subjectData[sub] / 60)}h
                                ${subjectData[sub] % 60}m
                            </span>
                        </div>

                        <div class="bar">
                            <div class="fill" style="width:${width}%"></div>
                        </div>

                    </div>
                `;
            }
        }

        // Task Performance
        let taskBox = document.getElementById("taskData");

        if (tasks.length === 0) {

            taskBox.innerHTML = `
                <div class="empty">
                    No Task Added
                </div>
            `;

        } else {

            tasks.forEach(task => {

                taskBox.innerHTML += `
                    <div class="task">

                        <h3>${task.name}</h3>

                        <p>Subject : ${task.subject}</p>

                        <p>Focus Time : ${task.focusTime || 0} Minutes</p>

                        <p class="${task.complete ? 'complete' : 'pending'}">
                            ${task.complete ? "Completed ✅" : "Pending ⏳"}
                        </p>

                    </div>
                `;

            });

        }

    </script>

</body>

</html>
